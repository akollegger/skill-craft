name: Test

# Every pull request must pass the two gates AGENTS.md names: typecheck and tests.
# No secrets are used. The live SDK tests spend real Claude usage and only run with LIVE_SDK=1, so they are
# skipped here.
on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor in package.json "engines"; 24 is what the project is developed on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
