<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-craft observer (mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Jersey+10&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --midnight: #171233;
  --dusk: #2a2150;
  --panel: #231b46;
  --line: #4a3d85;
  --text: #efe6ff;
  --muted: #a396d6;
  --lamp: #ffb45e;
  --sakura: #ff8fb1;
  --mint: #7ee8c7;
  --coral: #ff6b7a;
  --display: "Pixelify Sans", ui-monospace, monospace;
  --score: "Jersey 10", "Pixelify Sans", ui-monospace, monospace;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--midnight); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.4;
  background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255, 180, 94, .08), transparent 70%), linear-gradient(var(--midnight), #1d1640 60%, #231a4a);
}
.app { max-width: 1240px; margin: 0 auto; padding: 20px 20px 28px; }
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }

/* top bar: the display face is kept for large text only */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 24px var(--display); letter-spacing: .02em; }
.brand canvas, .goal canvas { image-rendering: pixelated; width: 30px; height: 30px; }
.goal { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; background: var(--panel); box-shadow: 0 0 0 3px var(--midnight), 0 0 0 5px var(--line); font: 400 20px var(--display); }
.goal strong { color: var(--lamp); font-weight: 600; }
.pbtn { border: 0; padding: 8px 14px; background: var(--dusk); cursor: pointer; font: 600 13px var(--mono); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .35), inset 3px 3px 0 rgba(255, 255, 255, .14); }
.pbtn:active { box-shadow: inset 3px 3px 0 rgba(0, 0, 0, .35); transform: translate(1px, 1px); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 820px); justify-content: center; gap: 22px; align-items: start; }
.stage.two { grid-template-columns: 1fr 10px 1fr; justify-content: stretch; }
.net { align-self: stretch; background: repeating-linear-gradient(to bottom, rgba(239, 230, 255, .55) 0 14px, transparent 14px 28px); }
.slot { min-width: 0; }

/* a pixel window */
.win { background: var(--panel); box-shadow: 0 0 0 4px var(--midnight), 0 0 0 8px var(--line), 10px 10px 0 8px #0d0a20; }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--dusk); }
.titlebar .ttl { flex: 1; margin-left: 4px; font: 600 20px var(--display); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 14px; height: 14px; border: 0; padding: 0; background: var(--line); display: inline-block; }
.dot.close { background: var(--coral); cursor: pointer; }
.dot.close:hover { background: #ff94a0; }
.dot.close[disabled] { background: var(--line); cursor: default; }
.chip { font: 600 12px var(--mono); padding: 2px 8px; background: var(--midnight); color: var(--mint); white-space: nowrap; }
.chip.replay, .chip.paused { color: var(--lamp); }
.chip.finished { color: var(--muted); }
.chip .pip { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: currentColor; }
.chip.live .pip { animation: pulse 1.2s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* the table view */
.body { padding: 14px 16px 16px; }
.score { display: flex; align-items: flex-end; gap: 16px; min-height: 96px; margin-bottom: 10px; }
.calls { font-family: var(--score); font-size: clamp(84px, 9vw, 128px); line-height: .8; color: var(--text); text-shadow: 4px 4px 0 var(--midnight); min-width: 2ch; }
.win-state .calls { color: var(--mint); }
.lost-state .calls { color: var(--coral); }
.stopped-state .calls { color: var(--lamp); }
.score-side { padding-bottom: 6px; color: var(--muted); }
.timebox { margin-left: auto; padding-bottom: 6px; text-align: right; color: var(--muted); }
.timebox .t { display: block; margin-top: 6px; font: 400 clamp(44px, 5vw, 64px)/.8 var(--score); color: var(--text); text-shadow: 3px 3px 0 var(--midnight); }
.win-state .timebox .t { color: var(--mint); }
.lost-state .timebox .t { color: var(--coral); }
.stopped-state .timebox .t { color: var(--lamp); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 240px; margin-top: 6px; }
.pips span { width: 8px; height: 8px; background: var(--mint); }
.pips span.over { background: var(--coral); }
.pips span.todo { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.room { background: var(--dusk); line-height: 0; box-shadow: 0 0 0 4px var(--midnight); }
.room canvas { display: block; image-rendering: pixelated; width: 100%; height: auto; aspect-ratio: 168 / 128; }
.transport { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; }
.transport button { width: 36px; height: 32px; padding: 0; border: 0; background: var(--dusk); cursor: pointer; box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .35), inset 3px 3px 0 rgba(255, 255, 255, .14); }
.transport button:active { box-shadow: inset 3px 3px 0 rgba(0, 0, 0, .35); transform: translate(1px, 1px); }
.transport svg { width: 22px; height: 22px; fill: currentColor; display: block; margin: auto; }
.transport input[type=range] { flex: 1; min-width: 60px; accent-color: var(--lamp); }
.transport .golive { width: auto; padding: 0 10px; font: 600 12px var(--mono); color: var(--mint); }
.transport [hidden] { display: none; }
.status { margin: 0 0 10px; min-height: 22px; font-size: 15px; }
.win-state .status { color: var(--mint); }
.lost-state .status { color: var(--coral); }
.stopped-state .status { color: var(--lamp); }
.tape { list-style: none; margin: 0; padding: 10px 12px; background: var(--midnight); box-shadow: 0 0 0 3px var(--line); min-height: 214px; font-size: 14px; }
.tape li { display: flex; gap: 12px; padding: 2px 0; color: var(--muted); white-space: nowrap; overflow: hidden; }
.tape li .n { width: 3ch; text-align: right; color: #6b5fb0; flex: none; }
.tape li .tm { width: 7ch; text-align: right; color: #7f73c4; flex: none; }
.tape li.now { color: var(--text); background: rgba(255, 180, 94, .16); box-shadow: -8px 0 0 rgba(255, 180, 94, .16), 8px 0 0 rgba(255, 180, 94, .16); }
.tape li.bad { color: var(--coral); }
.tape li.made { color: var(--mint); }
.tape li.read { opacity: .65; }
.tape li b { font-weight: 600; }

/* the run picker */
.pmain { min-width: 0; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 22px; padding: 12px 16px 0; color: var(--muted); font-size: 12px; }
.toolbar .grp { display: inline-flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; box-shadow: 0 0 0 2px var(--line); }
.seg button { border: 0; padding: 4px 10px; background: transparent; cursor: pointer; font: 600 12px var(--mono); color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--lamp); color: var(--midnight); }
.list { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.lhead, .lrow { display: grid; grid-template-columns: 34px minmax(0, 1.3fr) 96px 58px 70px minmax(60px, 1fr); align-items: center; gap: 12px; padding: 6px 10px; }
.lhead { color: var(--muted); font: 600 12px var(--mono); }
.lhead button { border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: right; cursor: pointer; }
.lhead button[aria-pressed=true] { color: var(--lamp); }
.lhead button[aria-pressed=true]::before { content: ""; display: inline-block; margin-right: 6px; border: 4px solid transparent; border-bottom: 6px solid var(--lamp); border-top: 0; }
.lrow { border: 0; background: var(--dusk); text-align: left; cursor: pointer; font: 400 13px var(--mono); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .3), inset 3px 3px 0 rgba(255, 255, 255, .08); }
.lrow:hover { background: #33285f; }
.lrow .rank { font: 400 28px/1 var(--score); color: var(--muted); text-align: center; }
.lrow.first .rank { color: var(--lamp); }
.lrow .rn { min-width: 0; display: flex; flex-direction: column; }
.lrow .rn b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .rn i { font-style: normal; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .out { font-weight: 600; color: var(--muted); }
.lrow .cn, .lrow .tmv { text-align: right; font-weight: 600; }
.lrow.reached .out, .lrow.reached .cn { color: var(--mint); }
.lrow.budget .out, .lrow.budget .cn { color: var(--coral); }
.lrow.stopped .out, .lrow.stopped .cn { color: var(--lamp); }
.lrow.live .out { color: var(--mint); }
.pbody { display: grid; grid-template-columns: 170px 1fr; min-height: 470px; }
.side { padding: 14px 10px; background: rgba(0, 0, 0, .18); display: flex; flex-direction: column; gap: 2px; }
.side h3 { margin: 12px 8px 4px; font: 600 12px var(--mono); color: var(--muted); }
.side h3:first-child { margin-top: 0; }
.side button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 6px 8px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: 400 13px var(--mono); }
.side button[aria-current=true] { background: rgba(255, 180, 94, .18); box-shadow: inset 3px 0 0 var(--lamp); }
.side button:hover { background: rgba(255, 255, 255, .06); }
.side .count { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 16px; align-content: start; }
.tile { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; border: 0; background: var(--dusk); cursor: pointer; text-align: left; box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .3), inset 3px 3px 0 rgba(255, 255, 255, .08); }
.tile:hover { background: #33285f; }
.tile .thumb { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile canvas { image-rendering: pixelated; width: 78px; height: 78px; background: var(--midnight); }
.tile .num { font: 400 54px/0.8 var(--score); color: var(--text); text-shadow: 3px 3px 0 var(--midnight); }
.tile .name { font: 600 13px var(--mono); }
.tile .tag { color: var(--muted); font-size: 11px; }
.tile .clock { color: var(--muted); font-size: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 2px; min-height: 8px; }
.strip i { width: 6px; height: 6px; background: var(--lamp); }
.strip i.c { background: var(--mint); }
.strip i.x { background: var(--coral); }
.strip i.r { background: #8a7bd0; }
.tile .out { font: 600 12px var(--mono); color: var(--muted); }
.tile.reached .num, .tile.reached .out { color: var(--mint); }
.tile.budget .num, .tile.budget .out { color: var(--coral); }
.tile.stopped .num, .tile.stopped .out { color: var(--lamp); }
.tile.live .out { color: var(--mint); }
.tile.live .out::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--mint); animation: pulse 1.2s steps(2) infinite; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 4px; }
.hint { margin: 0; padding: 10px 16px; color: var(--muted); font-size: 12px; background: rgba(0, 0, 0, .18); }

.foot { margin: 22px auto 0; color: var(--muted); font-size: 13px; max-width: 92ch; text-align: center; }
.foot kbd { font: inherit; padding: 0 6px; background: var(--dusk); box-shadow: inset 0 0 0 2px var(--line); }
.speed { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; }
.speed select { font: inherit; background: var(--dusk); color: var(--text); border: 0; padding: 4px 6px; box-shadow: inset 0 0 0 2px var(--line); }

@media (max-width: 860px) {
  .stage.two { grid-template-columns: 1fr; }
  .stage.two .net { height: 10px; width: 100%; background: repeating-linear-gradient(to right, rgba(239, 230, 255, .55) 0 14px, transparent 14px 28px); }
  .pbody { grid-template-columns: 1fr; }
  .side { flex-direction: row; flex-wrap: wrap; }
  .top { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { .chip.live .pip, .tile.live .out::before { animation: none; } }
</style>
</head>

      for (let k = s.avail - 1; k >= 0; k--) if (s.frames[k].grid.flat().some(Boolean)) { f = s.frames[k]; break; }
      g.fillStyle = C.w3; g.fillRect(2, 2, 48, 48);
      for (let r = 0; r < D.world.rows; r++) for (let c = 0; c < D.world.cols; c++) {
        const x = 4 + c * 15, y = 4 + r * 15; g.fillStyle = C.w1; g.fillRect(x, y, 14, 14);
        const it = f.grid[r][c]; if (it) g.drawImage(spriteFor(it).cv, x + 2, y + 2, 10, 10);
      }
    });
  }
  nav(e) {
    const items = [...this.$content.querySelectorAll("[data-id]")], i = items.indexOf(document.activeElement);
    if (i < 0) return;
    const per = prefs.view === "list" ? 1 : Math.max(1, items.filter((t) => t.offsetTop === items[0].offsetTop).length);
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + per, ArrowUp: i - per }[e.key];
    if (next !== undefined && items[next]) { e.preventDefault(); items[next].focus(); }
  }
  frame(now) {
    if (this.signature() !== this.sig) { this.render(); return; }
    this.thumbs();
    this.$content.querySelectorAll("[data-id]").forEach((b) => { const s = states.find((x) => x.run.id === b.dataset.id); if (s.status === "live") { const el = b.querySelector(".time"); const txt = fmt(s.clockNow(now)); if (el.textContent !== txt) el.textContent = txt; } });
  }
}

/* ---------- slots: each is a picker or a table ---------- */
const stage = document.getElementById("stage");
const slots = [];
let focused = null;
function mount(slot, view) { slot.view && slot.view.destroy(); slot.view = view; }
function showPicker(slot) { mount(slot, new Picker(slot.el, (s) => showTable(slot, s), slots.indexOf(slot) > 0 ? () => removeSlot(slot) : null)); focused = slot; }
function showTable(slot, state) { mount(slot, new Table(slot.el, state, () => showPicker(slot))); focused = slot; }
function layout() {
  stage.classList.toggle("two", slots.length === 2);
  stage.innerHTML = "";
  slots.forEach((s, k) => { if (k === 1) { const net = document.createElement("div"); net.className = "net"; net.setAttribute("aria-hidden", "true"); stage.appendChild(net); } stage.appendChild(s.el); });
  const b = document.getElementById("compare"); b.textContent = slots.length === 2 ? "Close comparison" : "Compare two runs"; b.setAttribute("aria-pressed", String(slots.length === 2));
}
function addSlot() { const el = document.createElement("section"); el.className = "slot"; const slot = { el, view: null }; el.addEventListener("pointerdown", () => (focused = slot)); slots.push(slot); return slot; }
function removeSlot(slot) { slot.view && slot.view.destroy(); slots.splice(slots.indexOf(slot), 1); layout(); focused = slots[0]; }
document.getElementById("compare").onclick = () => { if (slots.length === 2) removeSlot(slots[1]); else { const s = addSlot(); layout(); showPicker(s); } };

// the observer opens on the run picker; a live run shows up there as it starts
const first = addSlot(); layout(); showPicker(first);

/* ---------- keys and copy ---------- */
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button, input, select, .grid")) { if (e.key !== "Escape") return; }
  const v = focused && focused.view;
  if (e.key === "c") document.getElementById("compare").click();
  if (!(v instanceof Table)) return;
  if (e.code === "Space") { e.preventDefault(); v.togglePlay(); }
  else if (e.key === "ArrowRight") { v.mode = "paused"; v.setFrame(v.i + 1, true); }
  else if (e.key === "ArrowLeft") { v.mode = "paused"; v.setFrame(v.i - 1, false); }
  else if (e.key === "r") v.restart();
  else if (e.key === "Escape") v.onClose();
  else if (e.key === "x") slots.forEach((s) => s.view instanceof Table && (s.view.fx.refuse = performance.now()));
});
document.getElementById("goalText").innerHTML = `Make ${D.goal.qty === 1 ? "one" : D.goal.qty} <strong>${D.goal.item}</strong>`;
document.getElementById("logo").getContext("2d").drawImage(spriteFor("skill-craft").cv, 0, 0);
document.getElementById("goalSprite").getContext("2d").drawImage(spriteFor(D.goal.item).cv, 0, 0);
document.getElementById("foot").innerHTML = `Mock, world ${D.world.name}. Run 1 is a real recording; the others are scripted stand-ins. Space plays or pauses, the arrows step, <kbd>r</kbd> restarts, <kbd>Esc</kbd> closes a table, <kbd>c</kbd> compares, <kbd>x</kbd> previews a refused call. Only run 1's total time is real; the other clock times are illustrative.
  <span class="speed"><label for="speed">speed</label> <select id="speed"><option value="0.5">half</option><option value="1" selected>normal</option><option value="2">2x</option><option value="4">4x</option></select></span>`;
document.getElementById("speed").onchange = (e) => (speed = Number(e.target.value));

(function loop(t) { states.forEach((s) => s.tick(t)); slots.forEach((s) => s.view && s.view.frame(t)); requestAnimationFrame(loop); })(performance.now());
})();
</script>
</body>
</html>
